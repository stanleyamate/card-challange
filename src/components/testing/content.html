// Function to show modal with iframe, parameter is the src of the iframe
        function show_modal(iframeSrc, channel_name) {
            const modal = document.getElementById('modal');
            const iframe = document.getElementById('iframe-content');
            const myInput = document.getElementById('myInput');

            const modalTitle = document.getElementById('modal-title');

            // Set the iframe src
            iframe.src = iframeSrc;
            modalTitle.textContent = channel_name;
            myInput.value = "<iframe src='"+iframeSrc+"' allowfullscreen='true' frameborder='0' height='500px' scrolling='1'  width='100%'></iframe>"; 
            // Show the modal
            modal.style.display = 'flex';

            // Close button functionality
            document.getElementById('close').onclick = function () {
                modal.style.display = 'none';
                iframe.src = ''; // Clear iframe src when closing
            };

            // Close modal when clicking outside content
            window.onclick = function (event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                    iframe.src = ''; // Clear iframe src when closing
                }
            };
        }
